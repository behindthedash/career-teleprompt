# career-teleprompt -- worktrail-go policy.
# See worktrail's src/worktrail/router/policy.py DEFAULTS for the full
# schema. Every key is optional and defaults to a safe, do-nothing value
# until this repo opts in explicitly (e.g. pre_pr_cmd for the pre-PR test
# gate, automerge for GitHub-native auto-merge eligibility).
#
# pre_pr_cmd is a stopgap "skip" -- the prior value (ruff over src/tests/
# scripts) pointed at the pre-NexQ-merge Python layout, which no longer
# exists (src/ is now the Tauri/TS app, no tests/ dir at repo root; see
# .github/workflows/ci.yml for the actual gate: tsc --noEmit, npm run
# build, cargo check). This blocked the pre-PR preflight gate outright.
# CI remains the real merge gate per this repo's own convention; choosing
# a TS/Tauri-appropriate local mirror (e.g. `npx tsc --noEmit`) is a
# follow-up decision for whoever owns this repo, not guessed here.
pre_pr_cmd: skip

# Greenfield: most permissive setting available (max_risk is capped at
# medium in code -- high/critical are never automerge-eligible regardless
# of policy). target_branches left empty so this only ever applies against
# the base branch (dev); prd stays human-gated via its own ruleset.
automerge:
  enabled: true
  max_risk: medium
