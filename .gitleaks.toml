# gitleaks configuration for career-teleprompt.
#
# Extends gitleaks' built-in ruleset (never replaces it) and adds the single
# narrowest allowlist this repo needs. Both the per-PR `gitleaks-pr-diff`
# required check and the manual `gitleaks-full-history` job in
# .github/workflows/gitleaks.yml pick this file up automatically from the
# `--source` directory.
#
# Allowlist discipline: allowlist a *value*, never a path. A `paths` entry in
# gitleaks' global `[allowlist]` is OR'd with `regexes`, so adding one would
# silently exempt every future secret in that file too -- exactly the blind
# spot a required secrets check exists to close. Each entry below names the
# literal value and the source location that owns it.

[extend]
useDefault = true

[allowlist]
description = "Confirmed false positive: teleprompter preferences storage-key name"
# `regexTarget` defaults to "secret", so each entry matches the captured secret
# value itself (verified against gitleaks 8.21.2 -- the pinned GITLEAKS_VERSION
# in .github/workflows/gitleaks.yml), not the whole matched line.
regexes = [
  # src/teleprompter/preferences.ts:14 (the `TELEPROMPTER_PREFERENCES_KEY`
  # constant -- the localStorage key name for persisted teleprompter
  # preferences) was flagged as generic-api-key (entropy 3.595990) by the
  # one-time full-history scan run 35422753576 at commit 4abd9435. It is a
  # storage key name, never a credential, and is never sent anywhere --
  # nothing to rotate. Confirmed by triage brief 20260918-220100; the
  # anchored pattern suppresses exactly this value, so a secret-shaped
  # string anywhere else is still reported.
  '''^career-teleprompt\.teleprompter\.presentation\.v1$''',
]
