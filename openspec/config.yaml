schema: spec-driven

context: |
  Hearsay is a Python Windows desktop transcription host using WASAPI audio capture and local faster-whisper inference.
  It exposes generic finalized Remote/Local transcript events to downstream consumers through a supported public Python API.
  Hearsay owns speech capture/transcription/session mechanics and does not own downstream semantic interpretation, RAG, knowledge storage, interview UI, or teleprompter behavior.
  Normal persisted-transcript behavior remains supported, alongside generic live-only and lower-latency session profiles.
  Public extension imports must be side-effect-free and require only Hearsay core dependencies.
  The repository is public; never commit real transcript content, personal knowledge, credentials, machine-specific private paths, employer/customer details, or downstream consumer secrets.

rules:
  specs:
    - Treat openspec/specs as canonical greenfield host capability definitions, not deltas.
    - Keep requirements consumer-neutral and testable with synthetic transcript/session fixtures.
    - Never add RAG, vector-store, interview, resume, or teleprompter semantics to Hearsay host contracts.
    - Preserve ordinary Hearsay recording behavior as a regression boundary.
  proposal:
    - Future proposals must describe changes relative to the canonical host specs.
    - Keep upstream-generic work separable from fork-only maintenance changes.
