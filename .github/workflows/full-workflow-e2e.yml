name: Full Workflow E2E

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-workflow:
    name: Launcher, RAG, AI and teleprompter workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright tooling
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start E2E application server
        shell: bash
        run: |
          CAREER_TELEPROMPT_E2E=1 npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/career-teleprompt-workflow-vite.log 2>&1 &
          echo $! > /tmp/career-teleprompt-workflow-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/workflow-review.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/career-teleprompt-workflow-vite.log
          exit 1

      - name: Run full workflow Playwright test
        run: node scripts/full-workflow-e2e.mjs --base-url=http://127.0.0.1:4174

      - name: Surface application server log on failure
        if: failure()
        run: cat /tmp/career-teleprompt-workflow-vite.log || true

      - name: Upload workflow screenshots, report and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-teleprompt-full-workflow-e2e
          path: artifacts/full-workflow-e2e
          if-no-files-found: warn
          retention-days: 30
