name: Release

on:
  create:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build & Publish Windows Release
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v')) ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'release/v'))
    runs-on: windows-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7.0.1

      - name: Resolve and validate version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "create") {
            $branch = "${{ github.event.ref }}"
          } else {
            $branch = "${{ github.ref_name }}"
          }
          .\scripts\validate_release_metadata.ps1 -Branch $branch -EmitGitHubEnv

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install package build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build frozen application
        run: pyinstaller --noconfirm Hearsay.spec

      - name: Smoke-test diagnostics from frozen executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\Hearsay\Hearsay.exe" `
            -ArgumentList "--diagnostics-smoke" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen diagnostics smoke failed with exit code $($process.ExitCode)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path ".\installer_output\HearsaySetup.exe")) {
            throw "Expected installer_output\HearsaySetup.exe was not created"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload `
              $env:RELEASE_TAG `
              ".\installer_output\HearsaySetup.exe#HearsaySetup.exe" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            gh release create `
              $env:RELEASE_TAG `
              ".\installer_output\HearsaySetup.exe#HearsaySetup.exe" `
              --repo $env:GITHUB_REPOSITORY `
              --target "${{ github.sha }}" `
              --title "Hearsay $env:RELEASE_TAG" `
              --notes-file $env:RELEASE_NOTES
          }

          gh release view `
            $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json url,assets

      - name: Preserve release installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Hearsay-${{ env.RELEASE_VERSION }}-Windows-Installer
          path: installer_output/HearsaySetup.exe
          if-no-files-found: error
          retention-days: 30
