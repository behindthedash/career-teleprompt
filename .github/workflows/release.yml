name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build & Publish Career Teleprompt Windows Release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7.0.1

      - name: Validate release version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match package version $($package.version)"
          }
          if ($tauri.version -ne $package.version) {
            throw "Tauri version $($tauri.version) does not match package version $($package.version)"
          }
          Write-Host "Validated Career Teleprompt release $expectedTag"

      - name: Set up Node 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Tauri NSIS installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.installer.conf.json

      - name: Resolve installer path
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced"
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ASSET_NAME=Career-Teleprompt-${{ github.ref_name }}-Windows-Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

      - name: Smoke-test installed application lifecycle
        shell: pwsh
        run: .\scripts\smoke-test-windows-installer.ps1 -InstallerPath "$env:INSTALLER_PATH"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload `
              "${{ github.ref_name }}" `
              "$env:INSTALLER_PATH#$env:RELEASE_ASSET_NAME" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            gh release create `
              "${{ github.ref_name }}" `
              "$env:INSTALLER_PATH#$env:RELEASE_ASSET_NAME" `
              --repo $env:GITHUB_REPOSITORY `
              --target "${{ github.sha }}" `
              --title "Career Teleprompt ${{ github.ref_name }}" `
              --generate-notes
          }

      - name: Preserve release installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: career-teleprompt-${{ github.ref_name }}-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
