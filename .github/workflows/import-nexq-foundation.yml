name: Import pinned NexQ foundation

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Career Teleprompt PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned NexQ baseline
        run: |
          set -euo pipefail
          git clone https://github.com/naxhq/NexQ.git /tmp/nexq
          git -C /tmp/nexq checkout 1ce1524c122df509f231c521a07ada95bfde2d88
          test "$(git -C /tmp/nexq rev-parse HEAD)" = "1ce1524c122df509f231c521a07ada95bfde2d88"

      - name: Replace runtime foundation while preserving Career Teleprompt governance
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .worktrail \
            ! -name openspec \
            ! -name docs \
            ! -name AGENTS.md \
            ! -name CLAUDE.md \
            -exec rm -rf {} +

          rsync -a /tmp/nexq/ ./ \
            --exclude .git \
            --exclude .github \
            --exclude .planning \
            --exclude .playwright-mcp \
            --exclude website \
            --exclude .worktrail \
            --exclude openspec \
            --exclude AGENTS.md \
            --exclude CLAUDE.md

          cat > docs/FOUNDATION_MIGRATION.md <<'EOF'
          # Foundation migration

          The active application foundation in this branch is imported from NexQ commit
          `1ce1524c122df509f231c521a07ada95bfde2d88`.

          The pre-pivot Python Hearsay implementation remains recoverable in Git history.
          Career Teleprompt repository governance (`.github`, `.worktrail`, `AGENTS.md`,
          `CLAUDE.md`), OpenSpec artifacts, and migration documentation are retained across
          the runtime replacement.

          Upstream deployment/release workflows, internal planning artifacts, Playwright captures,
          and the NexQ marketing website are intentionally not imported. Career Teleprompt defines
          its own CI, release, and branding policy.

          The importer validates the platform-independent frontend before committing the tree.
          Windows-native Rust validation is performed by Career Teleprompt CI on `windows-latest`,
          matching the application's supported platform and NexQ's upstream CI contract.
          EOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend production build
        run: npm run build

      - name: Commit imported foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import pinned NexQ application foundation"
          git push origin HEAD:${{ github.head_ref }}
