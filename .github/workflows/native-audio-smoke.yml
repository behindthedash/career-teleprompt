name: Native Audio Smoke

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-audio-smoke:
    name: Windows PCM, VAD and source-routing smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run native audio smoke tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test native_audio_smoke -- --nocapture

      - name: Compile Windows WASAPI capture modules
        run: cargo check --manifest-path src-tauri/Cargo.toml
