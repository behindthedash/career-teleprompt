name: Windows Installer

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/release.yml"
      - "scripts/smoke-test-windows-installer.ps1"
      - "src-tauri/tauri.installer.conf.json"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build and smoke-test Career Teleprompt NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri NSIS installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.installer.conf.json

      - name: Resolve installer path
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced"
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

      - name: Smoke-test installed application lifecycle
        shell: pwsh
        run: .\scripts\smoke-test-windows-installer.ps1 -InstallerPath "$env:INSTALLER_PATH"

      - name: Upload validated Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: career-teleprompt-windows-installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
