name: Windows Installer

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Career Teleprompt NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri NSIS installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.installer.conf.json

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installers) {
            throw "No NSIS installer was produced"
          }
          $installers | ForEach-Object {
            Write-Host "Installer: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: career-teleprompt-windows-installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
