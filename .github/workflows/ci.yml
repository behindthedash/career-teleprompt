name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows tests, typecheck, build & Rust check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend production build
        run: npm run build

      - name: Interview question assembly tests
        run: cargo test question_detector --lib
        working-directory: src-tauri

      - name: Prepared Q&A retrieval tests
        run: cargo test prompt_builder --lib
        working-directory: src-tauri

      - name: Interview evidence reranker tests
        run: cargo test interview_rerank --lib
        working-directory: src-tauri

      - name: OpenAI compatibility tests
        run: cargo test openai_compat --lib
        working-directory: src-tauri

      - name: Rust check
        run: cargo check
        working-directory: src-tauri
